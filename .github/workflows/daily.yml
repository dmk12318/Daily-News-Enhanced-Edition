name: 每日新闻 · 抓取与发布

# 每天 UTC 00:00 = 北京 08:00。
# GitHub 的定时任务在高峰期会延迟几分钟到半小时，属正常。
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_editorial:
        description: 本次只抓新闻、不写专栏
        type: boolean
        default: false
      feed_time:
        description: "（可选）固定抓取时刻，如 2026-10-07T23:40；留空用当前时间。用于和本地对齐做逐条比对"
        type: string
        default: ""

permissions:
  contents: write      # 把当天数据提交回仓库
  pages: write         # 发布 Pages
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EDITORIAL_API_KEY: ${{ secrets.EDITORIAL_API_KEY }}
      EDITORIAL_BASE_URL: ${{ vars.EDITORIAL_BASE_URL }}
      EDITORIAL_MODEL: ${{ vars.EDITORIAL_MODEL || 'deepseek-flash' }}
      EDITORIAL_THINKING: "disabled"   # 开思考模式会吃光 max_tokens，正文变空
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 装依赖
        run: pip install --quiet trafilatura beautifulsoup4 lxml

      # 固定时间：优先取手动触发的输入，其次读仓库根目录的 .feed-time 文件。
      # 用 .feed-time 是为了让「推送即触发一次指定时间的运行」成为可能（平时不需要）。
      - name: 解析固定时间
        id: ft
        run: |
          V="${{ inputs.feed_time }}"
          if [ -z "$V" ] && [ -f .feed-time ]; then
            V="$(tr -d '[:space:]' < .feed-time)"
          fi
          echo "value=$V" >> $GITHUB_OUTPUT
          echo "固定抓取时刻 = ${V:-（未设置，用当前时间）}"

      - name: 抓取 + 按故事簇选稿
        # --fast 跳过真实浏览器那层：云端装 Chromium 太慢，且它只多覆盖个位数源
        if: ${{ github.event_name != 'push' || steps.ft.outputs.value != '' }}
        run: |
          FT=""
          if [ -n "${{ steps.ft.outputs.value }}" ]; then FT="--feed-time ${{ steps.ft.outputs.value }}"; fi
          python scripts/run_daily.py --fast --skip-discover $FT

      - name: 云端判栏目
        if: ${{ (github.event_name != 'push' || steps.ft.outputs.value != '') && inputs.skip_editorial != true }}
        continue-on-error: true
        run: |
          FT=""
          if [ -n "${{ steps.ft.outputs.value }}" ]; then FT="--feed-time ${{ steps.ft.outputs.value }}"; fi
          python scripts/cloud_editorial.py --classify $FT
          python scripts/classify.py --apply-index data/sections.json

      - name: 云端写三篇专栏
        if: ${{ (github.event_name != 'push' || steps.ft.outputs.value != '') && inputs.skip_editorial != true }}
        continue-on-error: true     # 专栏失败不能拖垮整期
        run: |
          FT=""
          if [ -n "${{ steps.ft.outputs.value }}" ]; then FT="--feed-time ${{ steps.ft.outputs.value }}"; fi
          python scripts/cloud_editorial.py --columns $FT

      - name: 生成日报
        run: |
          FT=""
          if [ -n "${{ steps.ft.outputs.value }}" ]; then FT="--feed-time ${{ steps.ft.outputs.value }}"; fi
          if [ -f out/中国专栏.md ]; then
            python scripts/digest.py $FT \
              --editorial 中国=out/中国专栏.md \
              --editorial 国际=out/国际专栏.md \
              --editorial 中国境外=out/中国境外专栏.md
          else
            python scripts/digest.py $FT
          fi

      - name: 渲染站点
        run: python scripts/render_html.py --all

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # 提交放最后且允许失败：即使没写权限，站点也已经构建完成，不会停更
      - name: 数据提交回仓库
        continue-on-error: true
        run: |
          git config user.name  "daily-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 固定时间触发属于一次性的，跑完就把标记文件删掉，避免天天重复
          git rm -q --ignore-unmatch .feed-time || true
          git add out data .gitignore
          git diff --staged --quiet || git commit -m "每日更新 $(date -u +%F)"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
